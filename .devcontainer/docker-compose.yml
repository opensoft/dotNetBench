# Project name for organizing all DevBench containers in Docker Desktop
# This creates the dev-bench project with dot_net_bench, java_bench, etc.
name: dev-benches

services:
  dotnet-bench:
    image: dotnet-bench:${USER:-brett}
    container_name: dotnet-bench
    env_file:
      - ../.env
    command: ["/bin/bash", "-c", 'sudo install -d -m 0700 -o "$$(id -u)" -g "$$(id -g)" "$$HOME/.workbenches-history" && if [ -f "$$HOME/.workbenches-history/.zsh_history" ]; then sudo chown "$$(id -u):$$(id -g)" "$$HOME/.workbenches-history/.zsh_history"; fi && exec sleep infinity']
    volumes:
      - dotnetbench-zshhistory:/home/${USER:-brett}/.workbenches-history
    working_dir: ${WORKING_DIR:-/workspace}
    privileged: true
    environment:
      - HISTFILE=/home/${USER:-brett}/.workbenches-history/.zsh_history
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - dotnet-bench-net

volumes:
  dotnetbench-zshhistory:

networks:
  dotnet-bench-net:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
